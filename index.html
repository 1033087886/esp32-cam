<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32-CAM 远程监看</title>
  <style>
    :root {
      --bg: #0f131a;
      --panel: #17212b;
      --line: #2a3b4b;
      --text: #e7f2ff;
      --muted: #96a8bb;
      --ok: #00d084;
      --warn: #ffb020;
      --bad: #ff4d4f;
      --accent: #00aaff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, #1a2b3f, var(--bg) 45%);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      padding: 20px;
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--warn);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .dot.ok  { background: var(--ok);  box-shadow: 0 0 6px var(--ok); animation: pulse 1.4s ease-in-out infinite; }
    .dot.bad { background: var(--bad); }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0,208,132,0.5); }
      50%       { box-shadow: 0 0 0 6px rgba(0,208,132,0); }
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .card {
      background: rgba(23, 33, 43, 0.9);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      transition: border-color 0.2s, transform 0.15s;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .k {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .v {
      font-size: 18px;
      font-weight: 600;
    }

    #statusValue.ok   { color: var(--ok); }
    #statusValue.warn { color: var(--warn); }
    #statusValue.bad  { color: var(--bad); }

    .viewer {
      background: rgba(23, 33, 43, 0.8);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
    }

    .img-wrap {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 180px;
      background: #0b0f14;
      border: 2px solid var(--accent);
      border-radius: 8px;
      box-shadow: 0 0 18px rgba(0, 170, 255, 0.25);
      overflow: hidden;
    }

    #videoStream {
      display: block;
      max-width: 100%;
      max-height: 80vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    #placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
      gap: 10px;
      pointer-events: none;
    }

    #placeholder svg {
      opacity: 0.35;
    }

    #placeholder.hidden { display: none; }

    .actions {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 9px 16px;
      background: #2585ff;
      color: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: filter 0.15s, opacity 0.15s;
    }

    button:hover:not(:disabled) { filter: brightness(1.1); }
    button:active:not(:disabled) { transform: scale(0.96); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #countdown {
      font-size: 13px;
      color: var(--muted);
    }

    .light-ctrl {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .light-ctrl.hidden { display: none; }

    #lightSlider {
      flex: 1;
      min-width: 120px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    #lightLabel {
      font-size: 13px;
      color: var(--muted);
      min-width: 50px;
    }

    @media (max-width: 480px) {
      body { padding: 12px; }
      h1 { font-size: 18px; }
      .v { font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>
      <span class="dot" id="dot"></span>
      ESP32-CAM 远程监看
    </h1>

    <div class="meta">
      <div class="card">
        <div class="k">连接状态</div>
        <div class="v warn" id="statusValue">初始化中</div>
      </div>
      <div class="card">
        <div class="k">实时 FPS</div>
        <div class="v" id="fpsValue">—</div>
      </div>
      <div class="card">
        <div class="k">累计帧数</div>
        <div class="v" id="frameValue">0</div>
      </div>
      <div class="card">
        <div class="k">重连次数</div>
        <div class="v" id="reconnectValue">0</div>
      </div>
      <div class="card">
        <div class="k">分辨率</div>
        <div class="v" id="resolutionValue">—</div>
      </div>
      <div class="card">
        <div class="k">帧间隔</div>
        <div class="v" id="latencyValue">—</div>
      </div>
      <div class="card">
        <div class="k">接收带宽</div>
        <div class="v" id="bwValue">—</div>
      </div>
      <div class="card" id="lightCard">
        <div class="k">补光灯</div>
        <div class="v" id="lightValue">—</div>
      </div>
    </div>

    <div class="viewer">
      <div class="img-wrap">
        <img id="videoStream" alt="" />
        <div id="placeholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="6" width="20" height="14" rx="2"/>
            <path d="M8 6V4h8v2"/>
            <circle cx="12" cy="13" r="3"/>
          </svg>
          <span id="placeholderText">等待视频流…</span>
        </div>
      </div>
      <div class="actions">
        <button id="reconnectBtn" type="button">手动重连</button>
        <button id="snapshotBtn" type="button" disabled>截图</button>
        <button id="fullscreenBtn" type="button">全屏</button>
        <span id="countdown"></span>
      </div>
      <div class="light-ctrl hidden" id="lightCtrl">
        <button id="lightToggleBtn" type="button">补光灯 开/关</button>
        <input id="lightSlider" type="range" min="0" max="255" value="0" />
        <span id="lightLabel">0 / 255</span>
      </div>
    </div>
  </div>

  <script>
    const wsUrl = (() => {
      const p = new URLSearchParams(window.location.search).get("ws");
      return (p && p.trim()) ? p.trim() : "ws://8.166.129.84:8888/viewer?room=cam01";
    })();

    const $status      = document.getElementById("statusValue");
    const $fps         = document.getElementById("fpsValue");
    const $frame       = document.getElementById("frameValue");
    const $reconnect   = document.getElementById("reconnectValue");
    const $resolution  = document.getElementById("resolutionValue");
    const $latency     = document.getElementById("latencyValue");
    const $bw          = document.getElementById("bwValue");
    const $lightValue  = document.getElementById("lightValue");
    const $lightCtrl   = document.getElementById("lightCtrl");
    const $lightSlider = document.getElementById("lightSlider");
    const $lightLabel  = document.getElementById("lightLabel");
    const $lightToggle = document.getElementById("lightToggleBtn");
    const $img         = document.getElementById("videoStream");
    const $placeholder = document.getElementById("placeholder");
    const $phText      = document.getElementById("placeholderText");
    const $btn         = document.getElementById("reconnectBtn");
    const $snapshot    = document.getElementById("snapshotBtn");
    const $fullscreen  = document.getElementById("fullscreenBtn");
    const $countdown   = document.getElementById("countdown");
    const $dot         = document.getElementById("dot");

    // 补光灯控制（通过 WebSocket 发送控制指令）
    $lightCtrl.classList.remove("hidden");

    function sendLightCmd(value) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ cmd: "light", value: String(value) }));
    }

    $lightToggle.addEventListener("click", () => {
      const next = parseInt($lightSlider.value) > 0 ? 0 : 255;
      $lightSlider.value = next;
      $lightLabel.textContent = `${next} / 255`;
      $lightValue.textContent = String(next);
      sendLightCmd(next);
    });

    $lightSlider.addEventListener("change", () => {
      $lightValue.textContent = $lightSlider.value;
      sendLightCmd($lightSlider.value);
    });

    $lightSlider.addEventListener("input", () => {
      $lightLabel.textContent = `${$lightSlider.value} / 255`;
    });

    let ws             = null;
    let reconnectTimer = null;
    let countdownTimer = null;
    let reconnectCount = 0;
    let objectUrl      = null;
    let firstFrame     = true;

    // FPS
    let totalFrames  = 0;
    let secondFrames = 0;
    let secondStart  = performance.now();
    let fpsTimer     = null;

    // Latency (inter-frame interval)
    let lastFrameAt = 0;

    // Bandwidth
    let secondBytes = 0;
    let bwTimer     = null;

    function startBwTimer() {
      if (bwTimer) return;
      bwTimer = setInterval(() => {
        $bw.textContent = secondBytes < 1024
          ? `${secondBytes} B/s`
          : secondBytes < 1048576
            ? `${(secondBytes / 1024).toFixed(1)} KB/s`
            : `${(secondBytes / 1048576).toFixed(2)} MB/s`;
        secondBytes = 0;
      }, 1000);
    }

    function stopBwTimer() {
      if (!bwTimer) return;
      clearInterval(bwTimer);
      bwTimer     = null;
      $bw.textContent = "—";
      secondBytes = 0;
    }

    // Backoff: 2.5s → 5s → 10s → 20s (cap)
    const BACKOFF = [2500, 5000, 10000, 20000];
    let backoffIdx = 0;

    function setStatus(text, level) {
      $status.textContent = text;
      $status.className = `v ${level}`;
      $dot.className = `dot ${level === 'ok' ? 'ok' : level === 'bad' ? 'bad' : ''}`;
    }

    function showPlaceholder(text) {
      $phText.textContent = text;
      $placeholder.classList.remove("hidden");
    }

    function hidePlaceholder() {
      $placeholder.classList.add("hidden");
    }

    function startFpsTimer() {
      if (fpsTimer) return;
      fpsTimer = setInterval(() => {
        const now = performance.now();
        const dt  = now - secondStart;
        if (dt > 0) {
          $fps.textContent = ((secondFrames * 1000) / dt).toFixed(1);
        }
        secondFrames = 0;
        secondStart  = now;
      }, 1000);
    }

    function stopFpsTimer() {
      if (!fpsTimer) return;
      clearInterval(fpsTimer);
      fpsTimer     = null;
      $fps.textContent = "—";
      secondFrames = 0;
      secondStart  = performance.now();
    }

    function clearCountdown() {
      if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
      $countdown.textContent = "";
    }

    function startCountdown(ms) {
      clearCountdown();
      let remaining = Math.round(ms / 1000);
      $countdown.textContent = `${remaining}s 后重连`;
      countdownTimer = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          clearCountdown();
        } else {
          $countdown.textContent = `${remaining}s 后重连`;
        }
      }, 1000);
    }

    function cleanupSocket() {
      if (ws) {
        ws.onopen = ws.onclose = ws.onerror = ws.onmessage = null;
        try { ws.close(); } catch (_) {}
        ws = null;
      }
    }

    function scheduleReconnect() {
      if (reconnectTimer) return;
      const delay = BACKOFF[Math.min(backoffIdx, BACKOFF.length - 1)];
      backoffIdx = Math.min(backoffIdx + 1, BACKOFF.length - 1);
      startCountdown(delay);
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        connect(true);
      }, delay);
    }

    function connect(isAuto = false) {
      cleanupSocket();
      clearCountdown();
      if (isAuto) {
        reconnectCount += 1;
        $reconnect.textContent = String(reconnectCount);
      }

      firstFrame = true;
      lastFrameAt = 0;
      $latency.textContent = "—";
      setStatus("连接中…", "warn");
      showPlaceholder("连接中…");
      $btn.disabled = true;

      ws = new WebSocket(wsUrl);
      ws.binaryType = "blob";

      ws.onopen = () => {
        backoffIdx = 0;
        setStatus("已连接，等待视频帧", "ok");
        showPlaceholder("等待视频帧…");
        startFpsTimer();
        startBwTimer();
        $btn.disabled = false;
      };

      ws.onmessage = (event) => {
        if (!(event.data instanceof Blob)) return;

        const now = performance.now();
        if (lastFrameAt > 0) {
          $latency.textContent = `${Math.round(now - lastFrameAt)} ms`;
        }
        lastFrameAt = now;

        secondBytes += event.data.size;

        if (objectUrl) URL.revokeObjectURL(objectUrl);
        objectUrl = URL.createObjectURL(event.data);
        $img.src = objectUrl;

        if (firstFrame) {
          firstFrame = false;
          setStatus("串流中", "ok");
          hidePlaceholder();
          $snapshot.disabled = false;
        }

        totalFrames  += 1;
        secondFrames += 1;
        $frame.textContent = String(totalFrames);
      };

      ws.onclose = () => {
        setStatus("连接断开", "bad");
        showPlaceholder("连接断开，等待重连…");
        stopFpsTimer();
        stopBwTimer();
        $btn.disabled = false;
        $snapshot.disabled = true;
        scheduleReconnect();
      };

      ws.onerror = () => {
        setStatus("连接错误", "bad");
      };
    }

    $snapshot.addEventListener("click", () => {
      if (!objectUrl) return;
      const a = document.createElement("a");
      a.href = objectUrl;
      const ts = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
      a.download = `esp32cam_${ts}.jpg`;
      a.click();
    });

    $fullscreen.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        $img.requestFullscreen && $img.requestFullscreen();
      } else {
        document.exitFullscreen && document.exitFullscreen();
      }
    });

    $btn.addEventListener("click", () => {
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      clearCountdown();
      backoffIdx = 0;
      connect(false);
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        // 页签隐藏：暂停连接节省流量
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
        clearCountdown();
        cleanupSocket();
        stopFpsTimer();
        stopBwTimer();
        setStatus("已暂停（页签隐藏）", "warn");
        showPlaceholder("页签隐藏，已暂停串流");
      } else {
        // 页签恢复：立即重连
        backoffIdx = 0;
        connect(false);
      }
    });

    window.addEventListener("beforeunload", () => {
      if (reconnectTimer) clearTimeout(reconnectTimer);
      clearCountdown();
      if (fpsTimer) clearInterval(fpsTimer);
      if (bwTimer) clearInterval(bwTimer);
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      cleanupSocket();
    });

    $img.onload = () => {
      const w = $img.naturalWidth;
      const h = $img.naturalHeight;
      if (w > 0 && h > 0) {
        $resolution.textContent = `${w} × ${h}`;
      }
    };

    connect(false);
  </script>
</body>
</html>
