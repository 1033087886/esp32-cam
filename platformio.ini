; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient @ ^2.8
  gilmaimon/ArduinoWebsockets @ ^0.5.4
  ; pinned esp32-camera ref used by this project (GC2145 should be available in this line)
  ; use official GitHub source
  https://github.com/espressif/esp32-camera.git#efe711df9a348c56e56e5d7b8961836d94a0f9c1
build_flags =
  ; auto | ov2640 | ov3660 | gc2145
  ; override example: pio run -e esp32cam --project-option="build_flags=-D CAM_FORCE_SENSOR=gc2145"
  -D CAM_FORCE_SENSOR=auto
  ; stream relay config (injected at build time)
  -D STREAM_WS_HOST=\"8.166.129.84\"
  -D STREAM_WS_PORT=8888
  -D STREAM_WS_ROOM=\"cam01\"
  -D STREAM_WS_TOKEN=\"\"
